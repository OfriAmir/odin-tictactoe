<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofri's Tic Tac Toe!</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-div">
        <h1>Tic Tac Toe!</h1>
        <div class="display-scores">
            <span class="player-up-name">Player 1</span><span class = "player-up-score">0</span><span class="player-up-mark"></span>
            <span class="colon">:</span>
            <span class="player-down-name">Player 2</span><span class = "player-down-score">0</span><span class="player-down-mark"></span>
        </div>
        <div class="gameboard">
            <div class="gameboard-square one"></div>
            <div class="gameboard-square two"></div>
            <div class="gameboard-square three"></div>
            <div class="gameboard-square four"></div>
            <div class="gameboard-square five"></div>
            <div class="gameboard-square six"></div>
            <div class="gameboard-square seven"></div>
            <div class="gameboard-square eight"></div>
            <div class="gameboard-square nine"></div>
        </div>
        <div class="display-sentence-container">
            <p class="display-sentence"></p>
        </div>
        <div class="game-manager">
            <button class="restart-btn">Restart</button>
            <button class="settings-btn">Change Settings</button>
            <form class="settings-form" action="#" method="get" hidden>
                <div>
                    <label for="player-up">Player 1 name:</label>
                    <input class="player-up" type="text" id="player-up" name="player-up" value="Player 1">
                </div>
                <div>
                    <label for="player-down">Player 2 name:</label>
                    <input class="player-down" type="text" id="player-down" name="player-down" value="Player 2">
                </div>
                <div>
                    <label for="reset-scores">Reset scores</label>
                    <input class="reset-scores" type="checkbox" id="reset-scores" name="reset-scores">
                </div>
                <div>
                    <button class="submit-btn" type="button">OK</button>
                    <button class="cancel-btn" type="button">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
