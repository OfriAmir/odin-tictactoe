<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofri's Tic Tac Toe!</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-div">
        <div class="display-scores">
            <span class="playerX-name">Player 1</span><span class = "playerX-score">0</span>
            <span class="colon">:</span>
            <span class="playerO-name">Player 2</span><span class = "playerO-score">0</span>
        </div>
        <div class="gameboard">
            <div class="gameboard-square one"></div>
            <div class="gameboard-square two"></div>
            <div class="gameboard-square three"></div>
            <div class="gameboard-square four"></div>
            <div class="gameboard-square five"></div>
            <div class="gameboard-square six"></div>
            <div class="gameboard-square seven"></div>
            <div class="gameboard-square eight"></div>
            <div class="gameboard-square nine"></div>
        </div>
        <p class="display-sentence"></p>
        <div class="game-manager">
            <button class="restart-btn">Restart</button>
            <button class="settings-btn">Change Settings</button>
            <form class="settings-form" action="#" method="get" hidden>
                <div>
                    <label for="playerX">X player name:</label>
                    <input class="playerX" type="text" id="playerX" name="playerX" value="player 1">
                </div>
                <div>
                    <label for="playerO">O player name:</label>
                    <input class="playerO" type="text" id="playerO" name="playerO" value="player 2">
                </div>
                <div>
                    <label for="reset-scores">Reset scores</label>
                    <input class="reset-scores" type="checkbox" id="reset-scores" name="reset-scores">
                </div>
                <div>
                    <button class="submit-btn" type="button">OK</button>
                    <button class="cancel-btn" type="button">Cancel</button>
                </div>
            </form>
        </div>
    </div>
